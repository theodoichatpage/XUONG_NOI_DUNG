name: Verify Bridge package
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-extension.py
      - run: git diff --exit-code -- dist/downloads dist/chatgpt-bridge.js
      - run: python -m unittest discover -s tests -p 'test_extension_package.py'
      - run: node --test tests/*.test.cjs
