<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kết nối Xưởng</title><style>body{width:340px;margin:0;padding:18px;font:14px Arial,sans-serif;color:#f2f2f2;background:#0b0b0c}h1{font-size:18px;margin:0 0 4px}p{line-height:1.5;margin:8px 0}label{display:block;margin-top:10px;color:#b8b8bd}select,button{width:100%;height:32px;margin:6px 0;font:14px Arial,sans-serif;border-radius:0;box-sizing:border-box}select{background:#121213;color:#f2f2f2;border:1px solid #34343a;padding:0 8px}button{cursor:pointer;border:1px solid #34343a;background:#18181a;color:#f2f2f2}button:hover{border-color:#ff5a1f}#select{background:#ff5a1f;border-color:#ff5a1f;color:#0b0b0c;font-weight:bold}small{color:#8b8b90}#status{margin:12px 0 4px;padding:10px 12px;font-weight:bold;border:1px solid #34343a;background:#18181a;white-space:pre-wrap}#status.ok{border-color:#ff5a1f;background:#2a170f;color:#ffb59c}#status.ok::before{content:"● ";color:#ff5a1f}#status.off{border-color:#5c2323;background:#2a1212;color:#ff9a9a}#status.off::before{content:"○ "}#status.busy{border-color:#f2b33a;background:#2a2311;color:#f6cf7a}#status.busy::before{content:"◔ "}#hint{color:#b8b8bd;font-size:13px;margin:0 0 10px}#studio{margin:4px 0;padding:8px 12px;border:1px solid #34343a;background:#18181a}#studio.ok{border-color:#ff5a1f;color:#ffb59c}#studio.off{border-color:#5c2323;background:#2a1212;color:#ff9a9a}#studioFix{background:#2a170f;border-color:#ff5a1f;color:#ffb59c}</style><h1>Xưởng × ChatGPT</h1><small>Bridge 0.4.3 / không dùng API key</small><p id="status" role="status">Đang kiểm tra…</p><p id="hint"></p><p id="studio" role="status">Trang Xưởng: đang kiểm tra…</p><button id="studioFix" hidden></button><label for="tabs">Tab ChatGPT</label><select id="tabs"></select><button id="select">Kết nối tab đã chọn</button><button id="open">Mở ChatGPT mới</button><button id="refresh">Tải lại danh sách</button><button id="stop">Dừng đồng bộ công việc</button><p><small>Sau khi cài hoặc cập nhật extension, tải lạ
